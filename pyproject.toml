[project]
name = "read2me"
version = "0.1.0"
description = "Read a markdown document aloud with a local neural text-to-speech model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Scaturro" }]
# misaki (Kokoro's English pronunciation) supports Python < 3.13
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio[tts]==0.6.5",
    # misaki's English G2P, without its [en] extra: that extra adds spacy-curated-transformers,
    # which pulls in ~600 MB of PyTorch that the small spaCy model below never uses
    "misaki>=0.9.4",
    "spacy>=3.8",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    # misaki downloads this with pip at runtime when it's missing, which fails in a uv tool env
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "markdown-it-py>=3",
    "sounddevice>=0.5",
    "numpy",
    "scipy",
    "mistral-common[audio]>=1.11",
]

[project.urls]
Repository = "https://github.com/brianium/read2me"

[project.scripts]
read2me = "read2me.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
